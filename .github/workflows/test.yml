name: test

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: "wheel workflow run ID to test"
        required: true
        type: string

jobs:
  test_macos:
    strategy:
      matrix:
        platform:
          - name: macos-26_arm64
            runs_on: macos-26
          - name: macos-15_arm64
            runs_on: macos-15
        python_version:
          - "3.14"
          - "3.14t"
          - "3.13"
          - "3.12"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      - name: Run tests
        run: |
          uv run pytest tests/ --timeout=30 --tb=short -v
        env:
          UV_NO_SYNC: 1

  test_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
          - name: ubuntu-24.04_arm64
            runs_on: ubuntu-24.04-arm
          - name: ubuntu-22.04_x86_64
            runs_on: ubuntu-22.04
          - name: ubuntu-22.04_arm64
            runs_on: ubuntu-22.04-arm
        python_version:
          - "3.14"
          - "3.14t"
          - "3.13"
          - "3.12"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      - name: Run tests
        run: |
          uv run pytest tests/ --timeout=30 --tb=short -v
        env:
          UV_NO_SYNC: 1

  test_windows:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-2025_x86_64
            runs_on: windows-2025
        python_version:
          - "3.14"
          # Windows の Python 3.14t (free-threaded) は nanobind のビルドで
          # Py_GIL_DISABLED マクロが正しく検出されないため、現時点では非対応
          # - "3.14t"
          - "3.13"
          - "3.12"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        shell: bash
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        shell: bash
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      - name: Run tests
        shell: bash
        run: |
          uv run pytest tests/ --timeout=30 --tb=short -v
        env:
          UV_NO_SYNC: 1
