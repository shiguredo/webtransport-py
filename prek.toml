# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]
exclude = { glob = ["_deps/**", "_build/**", "dist/**", ".venv/**", "refs/**"] }

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # .clang-format は複数ドキュメント YAML のため除外する
  { id = "check-yaml", exclude = { glob = [".clang-format"] } },
  { id = "check-toml" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
]

# tombi: TOML のフォーマッタ・リンタ
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.2"
hooks = [
  # uv.lock は自動生成ファイルなので tombi の対象外にする
  { id = "tombi-lint", exclude = { glob = ["**/uv.lock"] } },
  { id = "tombi-format", exclude = { glob = ["**/uv.lock"] } },
]

# astral-sh/ruff-pre-commit: ruff の公式フック
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.6"

# ruff check: リンタ
[[repos.hooks]]
id = "ruff-check"
priority = 10

# ruff format: フォーマッタ
[[repos.hooks]]
id = "ruff-format"
priority = 0

# pre-commit/mirrors-clang-format: C++ のフォーマッタ
# rev が clang-format 本体のバージョンになる
[[repos]]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v23.1.0"
hooks = [
  # c++ のみ対象にする (json 等に clang-format を適用しないため)
  { id = "clang-format", types = ["c++"] },
]

# astral-sh/ty-pre-commit: ty の公式フック
# rev は ty 本体のバージョンに対応する
# 全体検査のため、診断対象は pyproject.toml の [tool.ty.src] で src に絞る
# --isolated で uv.lock / .venv を変更せずに実行する
# このフックは uv 0.12 以降の `uv check` を使う
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.78"
hooks = [
  { id = "ty", args = ["--isolated"] },
]

# プロジェクト固有のローカルフック
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "local"

# pytest: ユニットテスト
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest --timeout=30"
language = "system"
types = ["python"]
pass_filenames = false
priority = 30
