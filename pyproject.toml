[build-system]
requires = ["scikit-build-core>=1.0.3", "nanobind>=2.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "webtransport-py"
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
dynamic = ["version"]
description = "webtransport-py is a Sans-IO WebTransport/HTTP3/HTTP2/QUIC library using ngtcp2, nghttp3 and nghttp2."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Source = "https://github.com/shiguredo/webtransport-py"
Discord = "https://discord.gg/shiguredo"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "example" },
  { include-group = "lint" },
  { include-group = "build" },
  # 実ブラウザ (Chromium) を使った WebTransport E2E テスト用
  "playwright~=1.62.0",
  "pytest-playwright~=0.8.0",
]
test = [
  "pytest",
  "pytest-timeout",
  "pytest-asyncio",
  "cryptography",
  "hypothesis",
]
example = ["structlog"]
lint = ["ruff", "ty"]
# make develop (--no-build-isolation) 用。build-system.requires と揃える
build = [
  "scikit-build-core>=1.0.3",
  "nanobind>=2.13.0",
]

[tool.scikit-build]
minimum-version = "1.0.3"
sdist.include = ["VERSION", "deps.json"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.2"
define = { "CMAKE_CXX_STANDARD" = "20" }

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.wheel]
packages = ["src/webtransport"]
expand-macos-universal-tags = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# package = false のため、ソースツリーを import パスに載せる
pythonpath = ["src"]
# Property-Based Testing (PBT) は prop_ prefix を使用する
python_files = ["test_*.py", "prop_*.py"]
python_functions = ["test_*", "prop_*"]
# 実ブラウザ (Chromium) を使うテストは playwright 未導入の CI では実行しない
# ため、collection 対象から除外する (marker の -m だけでは import を防げない)
addopts = ["--ignore=tests/browser"]
markers = [
  "browser: 実ブラウザ (Chromium) を使う E2E テスト",
]

[tool.ty.rules]
unresolved-import = "ignore"
