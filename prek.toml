# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]
exclude = { glob = ["_deps/**", "_build/**", "dist/**", ".venv/**", "refs/**"] }

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  # .clang-format は複数ドキュメント YAML のため除外する
  { id = "check-yaml", exclude = { glob = [".clang-format"] } },
  { id = "check-toml" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
]

# tombi: TOML のフォーマッタ・リンタ
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.4"
hooks = [
  # uv.lock は自動生成ファイルなので tombi の対象外にする
  { id = "tombi-lint", exclude = { glob = ["**/uv.lock"] } },
  { id = "tombi-format", exclude = { glob = ["**/uv.lock"] } },
]

# プロジェクト固有のローカルフック
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "local"

# ruff format: フォーマッタ
[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
types = ["python"]
priority = 0

# ruff check: リンタ
[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check"
language = "system"
types = ["python"]
priority = 10

# ty check: 静的型チェッカ (パッケージ本体のみ。examples / tests は対象外)
[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run ty check src"
language = "system"
types = ["python"]
pass_filenames = false
priority = 20

# pytest: ユニットテスト
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest --timeout=30"
language = "system"
types = ["python"]
pass_filenames = false
priority = 30
