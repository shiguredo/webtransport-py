name: wheel

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  actions: read

jobs:
  build_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
          - name: ubuntu-24.04_arm64
            runs_on: ubuntu-24.04-arm
        python_version:
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _deps
          key: ${{ runner.os }}-deps-${{ matrix.platform.name }}-${{ hashFiles('deps.json', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.platform.name }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm golang-go

      - name: Build wheel
        run: uv build --wheel

      - name: Repair wheel with auditwheel
        shell: bash
        run: |
          # 失敗時は記号を明示して原因調査できるようにする
          if ! uvx auditwheel repair dist/*.whl --strip --only-plat; then
            uvx auditwheel show dist/*.whl || true
            exit 1
          fi
      - name: Upload Repaired Wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  build_macos:
    strategy:
      matrix:
        platform:
          - name: macos-26_arm64
            runs_on: macos-26
        python_version:
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _deps
          key: ${{ runner.os }}-deps-${{ matrix.platform.name }}-${{ hashFiles('deps.json', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.platform.name }}-

      - name: Install build dependencies
        run: |
          # dwnx は autotools でビルドするため、macOS ランナーへ autotools を入れる
          brew install nasm go autoconf automake libtool pkg-config

      - run: uv build --wheel --out-dir wheelhouse
      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  test:
    needs:
      - build_ubuntu
      - build_macos
    uses: ./.github/workflows/test.yml

  publish_wheel:
    if: contains(github.ref, 'tags/202')
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
          - name: ubuntu-24.04_arm64
          - name: macos-26_arm64
        python_version:
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheelhouse

  create-release:
    if: contains(github.ref, 'tags/202')
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
      - name: Create release files list
        run: |
          find artifacts -name "*.whl" -type f > release_files.txt
      - name: Create GitHub Release
        run: |
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            gh release create ${{ github.ref_name }} \
              --title "${{ github.ref_name }}" \
              --prerelease \
              $(cat release_files.txt | xargs)
          else
            gh release create ${{ github.ref_name }} \
              --title "${{ github.ref_name }}" \
              $(cat release_files.txt | xargs)
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ビルド・テスト・リリース結果を Slack に通知する
  # Fixed 判定のため actions: read が必要。パブリックリポジトリのため contents: read は不要
  slack-notify:
    needs:
      - test
      - publish_wheel
      - create-release
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@27c6a25432cf731e39887c8cd77b10f5465cb24c # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: python-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
