name: wheel

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "tests/**"

permissions:
  contents: write
  actions: read

jobs:
  build_macos:
    strategy:
      matrix:
        platform:
          - name: macos-26_arm64
            runs_on: macos-26
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _deps
          key: ${{ runner.os }}-deps-${{ matrix.platform.name }}-${{ hashFiles('deps.json', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.platform.name }}-

      - name: Install build dependencies
        run: |
          brew install nasm go

      - run: uv build --wheel --out-dir wheelhouse
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  build_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-26.04_x86_64
            runs_on: ubuntu-26.04
          - name: ubuntu-26.04_arm64
            runs_on: ubuntu-26.04-arm
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
          - name: ubuntu-24.04_arm64
            runs_on: ubuntu-24.04-arm
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _deps
          key: ${{ runner.os }}-deps-${{ matrix.platform.name }}-${{ hashFiles('deps.json', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.platform.name }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm golang-go

      - name: Build wheel
        run: uv build --wheel

      - name: Repair wheel with auditwheel
        shell: bash
        run: |
          # Ubuntu 26.04 + free-threaded など、auditwheel の manylinux 上限
          # (現状 2_41) を超える記号を含む場合は linux_* タグのまま出す
          mkdir -p wheelhouse
          if ! uvx auditwheel repair dist/*.whl --strip --only-plat -w wheelhouse; then
            echo "auditwheel manylinux repair failed; keeping linux platform tag"
            uvx auditwheel show dist/*.whl || true
            cp dist/*.whl wheelhouse/
          fi
      - name: Upload Repaired Wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  build_windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-2025_x86_64
            runs_on: windows-2025-vs2026
            python_version: "3.14"
            # x86_64 はそのまま
            uv_python: "3.14"
          - name: windows-11_arm64
            runs_on: windows-11-vs2026-arm
            python_version: "3.14"
            # uv は Windows ARM64 で x86_64 Python を優先するため、
            # ネイティブ aarch64 を明示する (AWS-LC も ARM64 + ClangCL が必要)
            uv_python: "3.14-aarch64"
          # Windows の Python 3.14t (free-threaded) は nanobind のビルドで
          # Py_GIL_DISABLED マクロが正しく検出されないため、現時点では非対応
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.uv_python }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _deps
          key: ${{ runner.os }}-deps-${{ matrix.name }}-${{ hashFiles('deps.json', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.name }}-

      - name: Verify native ARM64 Python
        if: matrix.name == 'windows-11_arm64'
        shell: bash
        run: |
          # --no-project: 依存同期で cryptography 等のソースビルドが走らないようにする
          arch=$(uv run --no-project python -c "import platform; print(platform.machine())")
          echo "Python machine=${arch}"
          test "${arch}" = "ARM64"

      - name: Build wheel
        run: uv build --wheel --out-dir wheelhouse
      - name: Upload Wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  test:
    needs:
      - build_macos
      - build_ubuntu
      - build_windows
    uses: ./.github/workflows/test.yml

  publish_wheel:
    if: contains(github.ref, 'tags/202')
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-26.04_x86_64
          - name: ubuntu-26.04_arm64
          - name: ubuntu-24.04_x86_64
          - name: ubuntu-24.04_arm64
          - name: macos-26_arm64
          - name: windows-2025_x86_64
          - name: windows-11_arm64
        python_version:
          - "3.14"
          - "3.14t"
        exclude:
          # Windows の Python 3.14t は非対応
          - platform:
              name: windows-2025_x86_64
            python_version: "3.14t"
          - platform:
              name: windows-11_arm64
            python_version: "3.14t"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse

  create-release:
    if: contains(github.ref, 'tags/202')
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
      - name: Create release files list
        run: |
          find artifacts -name "*.whl" -type f > release_files.txt
      - name: Create GitHub Release
        run: |
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            gh release create ${{ github.ref_name }} \
              --title "${{ github.ref_name }}" \
              --prerelease \
              $(cat release_files.txt | xargs)
          else
            gh release create ${{ github.ref_name }} \
              --title "${{ github.ref_name }}" \
              $(cat release_files.txt | xargs)
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ビルド・テスト・リリース結果を Slack に通知する
  # Fixed 判定のため actions: read が必要。パブリックリポジトリのため contents: read は不要
  slack-notify:
    needs:
      - test
      - publish_wheel
      - create-release
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: python-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
