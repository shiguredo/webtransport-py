[build-system]
requires = ["scikit-build-core>=1.0.3", "nanobind~=3.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "webtransport-py"
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
dynamic = ["version"]
description = "webtransport-py is a Sans-IO WebTransport/HTTP3/HTTP2/QUIC library using ngtcp2, nghttp3 and nghttp2."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Source = "https://github.com/shiguredo/webtransport-py"
Discord = "https://discord.gg/shiguredo"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "example" },
  { include-group = "build" },
  # prek.toml の ruff-pre-commit と同じバージョンに固定する。ローカルと CI で
  # 検出結果が食い違わないようにするため、更新時は両方を同時に上げる
  "ruff==0.16.6",
  # 実ブラウザ (Chromium) を使った WebTransport E2E テスト用
  "playwright~=1.62.0",
  "pytest-playwright~=0.9.0",
]
test = [
  "pytest",
  "pytest-timeout",
  "pytest-asyncio",
  "cryptography",
  "hypothesis",
]
example = ["structlog"]
# make develop (--no-build-isolation) 用。build-system.requires と揃える
build = [
  "scikit-build-core>=1.0.3",
  "nanobind~=3.0.0",
]

[tool.scikit-build]
minimum-version = "1.0.3"
sdist.include = ["VERSION", "deps.json"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.2"
define = { "CMAKE_CXX_STANDARD" = "20" }

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.wheel]
packages = ["src/webtransport"]
expand-macos-universal-tags = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"
line-length = 100

