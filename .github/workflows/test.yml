name: test

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: "wheel workflow run ID to test"
        required: true
        type: string

jobs:
  test_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
          - name: ubuntu-24.04_arm64
            runs_on: ubuntu-24.04-arm
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      # prek で静的チェックを行う。pytest は wheel に対する別ステップで実行するため除外する
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 0.5.2
          extra-args: --all-files --skip pytest

      - name: Run tests
        run: |
          # pythonpath=["src"] だとチェックアウトの src が wheel より優先され、
          # 拡張モジュール無しのパッケージを import してしまうため無効化する
          uv run pytest tests/ --timeout=30 --tb=short -v -o pythonpath=
        env:
          UV_NO_SYNC: 1

  test_macos:
    strategy:
      matrix:
        platform:
          - name: macos-26_arm64
            runs_on: macos-26
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      # prek で静的チェックを行う。pytest は wheel に対する別ステップで実行するため除外する
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 0.5.2
          extra-args: --all-files --skip pytest

      - name: Run tests
        run: |
          # pythonpath=["src"] だとチェックアウトの src が wheel より優先され、
          # 拡張モジュール無しのパッケージを import してしまうため無効化する
          uv run pytest tests/ --timeout=30 --tb=short -v -o pythonpath=
        env:
          UV_NO_SYNC: 1

  # deprecated な ssize_t 版 nghttp2 API に戻るとビルドが壊れることを検出する。
  # 拡張モジュールのコンパイルでのみ NGHTTP2_NO_SSIZE_T を定義し、
  # 依存ライブラリのビルドには影響させない
  build_no_ssize_t:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
        python_version:
          - "3.14"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _deps
          key: ${{ runner.os }}-deps-${{ matrix.platform.name }}-${{ hashFiles('deps.json', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ matrix.platform.name }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm golang-go

      - name: Build wheel without deprecated ssize_t APIs
        env:
          CMAKE_ARGS: "-DCMAKE_CXX_FLAGS=-DNGHTTP2_NO_SSIZE_T"
        run: uv build --wheel
