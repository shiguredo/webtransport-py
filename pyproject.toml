[build-system]
requires = ["scikit-build-core~=1.1.1", "nanobind~=3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "webtransport-py"
authors = [{ name = "Shiguredo Inc.", email = "contact+pypi@shiguredo.jp" }]
dynamic = ["version"]
description = "webtransport-py is a Sans-IO WebTransport/HTTP3/HTTP2/QUIC/QMux library using ngtcp2, nghttp3, nghttp2-v2 and dwnx."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Source = "https://github.com/shiguredo/webtransport-py"
Discord = "https://discord.gg/shiguredo"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "example" },
  { include-group = "build" },
  # 実ブラウザ (Chromium) を使った WebTransport E2E テスト用
  "playwright~=1.62.0",
  "pytest-playwright~=0.9.0",
]
test = [
  "pytest",
  "pytest-timeout",
  "pytest-asyncio",
  "cryptography",
  "hypothesis",
]
example = ["structlog"]
# make develop (--no-build-isolation) 用。build-system.requires と揃える
build = [
  "scikit-build-core~=1.1.1",
  "nanobind~=3.1.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
sdist.include = ["VERSION", "deps.json"]
build-dir = "_build"

[tool.scikit-build.cmake]
version = ">=4.2"
define = { "CMAKE_CXX_STANDARD" = "20" }

[tool.scikit-build.build]
verbose = false

[tool.scikit-build.wheel]
packages = ["src/webtransport"]
expand-macos-universal-tags = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = "^(?P<value>.+)$"

[tool.uv]
package = false
managed = true
python-preference = "only-managed"

[tool.ruff]
target-version = "py314"
line-length = 100
# nanobind が生成する型スタブは整形しないため、ruff の対象外にする
extend-exclude = ["src/webtransport/webtransport_ext"]

# 検出ルールは ruff 0.16.6 の既定値 (413 ルール) をそのまま使う。既定値は
# バージョンに依存するため prek.toml の ruff-pre-commit の rev を固定し、
# 更新時は同じバージョンの ruff で `ruff check --show-settings <file>` の
# `linter.rules.enabled` の差分を確認する

[tool.ruff.lint.isort]
# ビルド成果物 (*.so) が src に置かれるローカル環境と、置かれない CI とで
# first-party 判定が分かれるのを防ぐため、webtransport を明示的に first-party に指定する
known-first-party = ["webtransport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# package = false のため、ソースツリーを import パスに載せる
pythonpath = ["src"]
# Property-Based Testing (PBT) は prop_ prefix を使用する
python_files = ["test_*.py", "prop_*.py"]
python_functions = ["test_*", "prop_*"]
# 実ブラウザ (Chromium / Firefox / WebKit) を使うテストは playwright 未導入の
# CI では実行しないため、collection 対象から除外する (marker の -m だけでは
# import を防げない)
addopts = ["--ignore=tests/browser"]
markers = [
  "browser: 実ブラウザ (Chromium / Firefox / WebKit) を使う E2E テスト",
]

# ty-pre-commit は全体検査のため、診断対象をパッケージ本体に絞る
[tool.ty.src]
include = ["src", "examples"]

# TOML フォーマッタ・リンタ (tombi) の設定。tombi.toml を廃止して pyproject.toml へ統合した
[tool.tombi]

# scikit-build-core の [[tool.dynamic-metadata]] など、tombi / SchemaStore が
# まだ正しく扱えない構成があるためスキーマ検証は無効化する
[tool.tombi.schema]
enabled = false

# uv.lock などの自動生成ファイルを tombi の処理対象から除外する
[tool.tombi.files]
exclude = [
  "**/uv.lock",
  "**/_deps/**",
  "**/_build/**",
  "**/dist/**",
  "**/.venv/**",
]
