name: test

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: "wheel workflow run ID to test"
        required: true
        type: string

jobs:
  test_macos:
    strategy:
      matrix:
        platform:
          - name: macos-26_arm64
            runs_on: macos-26
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      - name: Run tests
        run: |
          # pythonpath=["src"] だとチェックアウトの src が wheel より優先され、
          # 拡張モジュール無しのパッケージを import してしまうため無効化する
          uv run pytest tests/ --timeout=30 --tb=short -v -o pythonpath=
        env:
          UV_NO_SYNC: 1

  test_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-26.04_x86_64
            runs_on: ubuntu-26.04
          - name: ubuntu-26.04_arm64
            runs_on: ubuntu-26.04-arm
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
          - name: ubuntu-24.04_arm64
            runs_on: ubuntu-24.04-arm
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      - name: Run tests
        run: |
          # pythonpath=["src"] だとチェックアウトの src が wheel より優先され、
          # 拡張モジュール無しのパッケージを import してしまうため無効化する
          uv run pytest tests/ --timeout=30 --tb=short -v -o pythonpath=
        env:
          UV_NO_SYNC: 1

  test_windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-2025_x86_64
            runs_on: windows-2025-vs2026
            python_version: "3.14"
            uv_python: "3.14"
          - name: windows-11_arm64
            runs_on: windows-11-vs2026-arm
            python_version: "3.14"
            # ビルドと同じくネイティブ aarch64 Python を使う
            uv_python: "3.14-aarch64"
          # Windows の Python 3.14t (free-threaded) は nanobind のビルドで
          # Py_GIL_DISABLED マクロが正しく検出されないため、現時点では非対応
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.uv_python }}

      - name: Download wheel artifact (workflow_call)
        if: ${{ !github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Download wheel artifact (workflow_dispatch)
        if: ${{ github.event.inputs.run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded wheels
        shell: bash
        run: |
          echo "Downloaded wheel files:"
          ls -la wheelhouse/

      - name: Install wheel
        shell: bash
        run: |
          uv sync --only-group test
          uv pip install wheelhouse/*.whl

      - name: Run tests
        shell: bash
        run: |
          # pythonpath=["src"] だとチェックアウトの src が wheel より優先され、
          # 拡張モジュール無しのパッケージを import してしまうため無効化する
          uv run pytest tests/ --timeout=30 --tb=short -v -o pythonpath=
        env:
          UV_NO_SYNC: 1
